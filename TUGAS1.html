<body>

<h1>Paket Hosting Pilihan</h1>

        <p>Kuota 200 MB<br>

    <div class="kartu hijau">
        <h2>Paket Profesional</h2>
        <p>Rp 75.000/Tahun</p>
        <p>Kuota 2 GB<br>

        <button>Pesan Sekarang</button>
    </div>
</div>
